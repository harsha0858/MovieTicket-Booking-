<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MovieBook | Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-body">

<div class="login-page">

    <div class="auth-container">

        <!-- LOGIN -->

        <form
            id="loginForm"
            class="auth-form"
        >

            <div class="auth-logo">
                🎬 Movie<span>Book</span>
            </div>

            <h2>
                Welcome Back 👋
            </h2>

            <p class="auth-subtitle">
                Login to continue booking movies.
            </p>


            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-btn auth-btn"
            >
                Login
            </button>


            <p class="switch-text">

                Don't have an account?

                <button
                    type="button"
                    id="showRegister"
                >
                    Register
                </button>

            </p>

        </form>


        <!-- REGISTER -->

        <form
            id="registerForm"
            class="auth-form hidden"
        >

            <div class="auth-logo">
                🎬 Movie<span>Book</span>
            </div>

            <h2>
                Create Account 🚀
            </h2>

            <p class="auth-subtitle">
                Create an account and start booking.
            </p>


            <div class="input-group">

                <label>Name</label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Minimum 6 characters"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-btn auth-btn"
            >
                Create Account
            </button>


            <p class="switch-text">

                Already have an account?

                <button
                    type="button"
                    id="showLogin"
                >
                    Login
                </button>

            </p>

        </form>

    </div>

</div>


<div
    id="toast"
    class="toast"
>

    <span id="toastMessage"></span>

</div>


<script
    type="module"
    src="./js/login.js"
></script>

</body>
</html>
